# Поля зонда для записи диагностики (навык stm32-diag-record, задачи «Диагностика: …» в .vscode/tasks.json).
# Те же поля, что в примере навыка, но без svd:, поэтому SVD не нужен. С SVD (настройка svdFile) можно
# добавить регистр, например вывод кадра PB15:
#   [[field]]
#   topic = "/probe/pin_frame"
#   message = "std_msgs/UInt32"
#   kind = "uint32"
#   expr = "svd:GPIOB.ODR.ODR15"
# В Renode счётчик тактов DWT не работает (work_cycles = 0), время эмуляции идёт по tick_ms.

[[field]]
topic = "/probe/frames"
message = "std_msgs/UInt32"
kind = "uint32"
expr = "(char*)&probe_telemetry + (long)&((ProbeTelemetry*)0)->frames"

[[field]]
topic = "/probe/tick_ms"
message = "std_msgs/UInt32"
kind = "uint32"
expr = "&platform_tick"

[[field]]
topic = "/probe/uptime_s"
message = "std_msgs/UInt32"
kind = "uint32_seconds"
expr = "&platform_tick"

[[field]]
topic = "/probe/sine_milli"
message = "std_msgs/Int32"
kind = "int32"
expr = "(char*)&probe_telemetry + (long)&((ProbeTelemetry*)0)->sine_milli"
min = -1000
max = 1000

[[field]]
topic = "/probe/ramp"
message = "std_msgs/Float32"
kind = "float32"
expr = "(char*)&probe_telemetry + (long)&((ProbeTelemetry*)0)->ramp"
min = 0.0
max = 1.0

[[field]]
topic = "/probe/work_cycles"
message = "std_msgs/UInt32"
kind = "uint32"
expr = "(char*)&probe_telemetry + (long)&((ProbeTelemetry*)0)->work_cycles"

[[field]]
topic = "/probe/loop_counter"
message = "std_msgs/UInt32"
kind = "uint32"
expr = "&probe_counter"
