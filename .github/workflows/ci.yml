# Сборка всех плат, дымовой тест в Renode и HIL-проверки без платы (host.traceability, prepare.*).
# Сценарии на плате (hw) выполняются только на стенде.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_VERSION: "14.2.1-1.1"
  XPACK_SHA256: "ed8c7d207a85d00da22b90cf80ab3b0b2c7600509afadf6b7149644e9d4790a6"
  ARM_TOOLCHAIN_ROOT: "/opt/xpack-arm-none-eabi-gcc-14.2.1-1.1"
  RENODE_VERSION: "1.17.0"
  RENODE_SHA256: "4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format (src/ only; cmsis/ is vendor code)
        run: clang-format --version && clang-format --dry-run --Werror src/*.c src/*.cpp src/*.h

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [f411ce, f401cc, f103c8]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache xPack GCC
        id: xpack
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_ROOT }}
          key: xpack-arm-none-eabi-gcc-${{ env.XPACK_VERSION }}-linux-x64

      - name: Install xPack GCC (SHA-256 verified)
        if: steps.xpack.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${XPACK_VERSION}/xpack-arm-none-eabi-gcc-${XPACK_VERSION}-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/xpack.tar.gz "$url"
          echo "${XPACK_SHA256}  /tmp/xpack.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/xpack.tar.gz -C /opt

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install Renode (SHA-256 verified)
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          curl -fsSL --retry 3 -o /tmp/renode.tar.gz "$url"
          echo "${RENODE_SHA256}  /tmp/renode.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/renode && sudo tar -xzf /tmp/renode.tar.gz -C /opt/renode --strip-components=1
          echo "RENODE_BINARY=/opt/renode/renode" >> "$GITHUB_ENV"

      - name: Debug and Release
        run: |
          for kind in debug release; do
            cmake --preset "${{ matrix.board }}-$kind"
            cmake --build --preset "${{ matrix.board }}-$kind"
          done

      - name: Renode smoke test without a board
        run: ctest --preset "${{ matrix.board }}-debug-emulator"

      - name: HIL without a board (traceability, prepare)
        run: |
          cmake --preset "${{ matrix.board }}-hil"
          cmake --build --preset "${{ matrix.board }}-hil"
          ctest --preset "${{ matrix.board }}-hil-host"

      - name: Keep firmware and emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}-*/stm32_skills_probe.elf
            build/${{ matrix.board }}-*/stm32_skills_probe.bin
            build/${{ matrix.board }}-*/stm32_skills_probe.hex
            build/${{ matrix.board }}-*/stm32_skills_probe.map
            build/${{ matrix.board }}-debug/renode-smoke/
            build/${{ matrix.board }}-hil/hwtest/
          if-no-files-found: warn
