# Конфигурация прогона HIL зонда для F103C8 (SESSION_CONFIG в cmake/hil.cmake). Пути — относительно файла.
[config]
target = "target.toml"
api = "../api.toml"

# Файлы данных проекта: t.profile.data["board"].
[data]
board = "board.toml"

# Неизменяемые свидетельства каждой попытки DDTT.
[results]
capture = true
